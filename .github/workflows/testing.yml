name: Testing

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Code checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check composer.json
        run: composer validate --strict --no-check-publish --no-check-version

      - name: Install dependencies
        # also runs Mozart, which copies easy-transients-for-wordpress to app/Dependencies.
        run: composer install --no-interaction --no-progress

      - name: Run PHPStan check
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run WordPress Coding Standard checks
        run: vendor/bin/phpcs .

      - name: PHP Compatibility check
        run: vendor/bin/phpcs -p app --standard=PHPCompatibilityWP --runtime-set testVersion 8.2-

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      # let the other PHP versions finish if one of them fails.
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    services:
      database:
        # a fixed LTS version, so a new major release does not break the tests unnoticed.
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # wait until the server accepts connections before the steps start.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # set up PHP first, so composer resolves the dependencies for the PHP version under test.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpunit-polyfills:1.1
          extensions: mbstring, xml, zip, intl, pdo, mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # the Playground packages in package-lock.json need Node 24.
          node-version: 24

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # the block editor script is loaded without checking whether it exists.
      - name: Build block editor script and commands
        run: |
          npm ci
          npm run build

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup tests
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 latest true

      - name: Run tests
        run: composer test
