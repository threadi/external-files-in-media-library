name: Build release zip

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup WP-CLI
        uses: godaddy-wordpress/setup-wp-cli@1

      - name: Run package installs and builds
        run: |
          composer install
          npm i
          npm run build:replacer
          npm run build:commands
          cd vendor/threadi/easy-directory-listing-for-wordpress/
          npm i
          npm run build
          cd ../../../
          rm -fr build
          rm -fr releases
          rm -fr svn
          rm -fr languages
          rm .gitignore
          rm .editorconfig
          rm changelog.md
          rm readme.md
          rm CODE_OF_CONDUCT.md
          rm -fr tests
          rm -fr bin

      - name: Generate autoloader
        run: composer dump-autoload -oa --no-dev

      - name: Run PHPStan analyse
        run: vendor/bin/phpstan analyse

      - name: PHP Compatibility check
        run: vendor/bin/phpcs -p app --standard=PHPCompatibilityWP

      - name: Run WordPress Coding Standard fixes
        run: vendor/bin/phpcbf .

      - uses: anchore/sbom-action@v0

      - name: Set version number 1
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'external-files-in-media-library.php'
          search-text: '@@VersionNumber@@'
          replacement-text: ${{ github.ref_name }}

      - name: Set version number 2
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'readme.txt'
          search-text: '@@VersionNumber@@'
          replacement-text: ${{ github.ref_name }}

      - name: More cleanup
        run: |
          rm phpcs.xml.dist
          rm phpunit.xml.dist
          rm -fr .github
          rm .gitattributes
          rm dev-composer.sh
          rm js/.gitkeep

      - name: Run PCP check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories:
            app/Dependencies/easyTransientsForWordPress/
          ignore-codes:
            WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedConstantFound
          include-experimental: false
          error-severity: 7
          warning-severity: 6
          include-low-severity-errors: true
        continue-on-error: true

      - name: Create ZIP release
        run: |
          cd ..
          zip -rq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/ -x "*/.git/*" "*/.github/*" "*/blocks/*/src/*" "*/docs/*" "*/composer.lock" "*/package.json" "*/package-lock.json" "*/.gitignore" "*/vendor/*" "*/node_modules/*" "/.editorconfig" "*/assets/*" "*/phpstan.neon" "*/Taskfile.yml" "*/libs/*" "*/src/*"
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/autoload.php
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/composer/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/ralouphie/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/symfony/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/guzzlehttp/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/spatie/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/graham-campbell/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/threadi/*/build/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/threadi/*/lib/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/threadi/*/src/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/vendor/threadi/*/assets/*
          zip -urq ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/node_modules/intro.js/minified/*
          cp ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ github.event.repository.name }}_${{ github.ref_name }}.zip

      - name: Smoke test the release zip in WordPress Playground
        run: |
          set -o pipefail
          mkdir -p /tmp/smoke
          unzip -q ${{ github.event.repository.name }}_*.zip -d /tmp/smoke

          npx @wp-playground/cli@latest run-blueprint \
            --blueprint=./.github/blueprints/smoke.json \
            --mount=/tmp/smoke/${{ github.event.repository.name }}:/wordpress/wp-content/plugins/${{ github.event.repository.name }} \
            --verbosity=debug \
            --debug \
            2>&1 | tee /tmp/smoke.log

          echo "----- Vollständiges Playground-Log -----"
          cat /tmp/smoke.log

          echo "----- Inhalt smoke-result.txt -----"
          cat /tmp/smoke/${{ github.event.repository.name }}/smoke-result.txt || echo "(File not found)"

          if ! grep -q "SMOKE_OK" /tmp/smoke/${{ github.event.repository.name }}/smoke-result.txt; then
            echo "::error::SMOKE_OK not found in smoke-result.txt - check log above."
            exit 1
          fi
