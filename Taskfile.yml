version: '3'

tasks:
  default:
    - task: prepare

  prepare:
    cmds:
      - composer install
      - composer update
      - npm i
      - npm run build

  check:
    cmds:
      - vendor/bin/phpstan analyse
      - vendor/bin/phpcbf .
      - vendor/bin/phpcs .

  # creates releases/external-files-in-media-library_<version>.zip, e.g. with "task build_zip -- 5.5.1".
  # uses bin/build-release.sh like the GitHub Action "Build release zip" and "ant build", so all create the same zip.
  # "npm run build" must have been run before (e.g. via "task prepare").
  build_zip:
    cmds:
      # get the dev packages back at the end, also if one of the following steps fails.
      - defer: bash bin/build-release.sh restore
      - bash bin/build-release.sh prepare
      - bash bin/build-release.sh collect {{.CLI_ARGS}}
      - bash bin/build-release.sh zip releases/external-files-in-media-library_{{.CLI_ARGS}}.zip

  # runs the checks and creates the release zip, e.g. with "task release -- 5.5.1".
  release:
    cmds:
      - task: prepare
      - task: check
      - task: build_zip
      - echo 'Release file generated'
